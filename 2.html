<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击图片播放视频</title>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: auto;
            margin-bottom: 20px;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            /* 半透明背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .video-overlay img {
            width: 100px;
            height: auto;
        }

        video {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="video1" controls playsinline preload="metadata">
            <source src="./video/2.mp4" type="video/mp4">
            您的浏览器不支持 video 标签。
        </video>
        <div class="video-overlay" data-target="video1">
            <img src="img/bPq5n9ShMy.png" alt="播放视频">
        </div>
    </div>
    <div class="video-container">
        <video id="video2" controls playsinline preload="metadata">
            <source src="./video/12.mp4" type="video/mp4">
            您的浏览器不支持 video 标签。
        </video>
        <div class="video-overlay" data-target="video2">
            <img src="img/bPq5n9ShMy.png" alt="播放视频">
        </div>
    </div>
    <!-- 更多视频可以继续按相同结构添加 -->
    <script>
        (function () {
            var currentPlaying = null; // 跟踪当前正在播放的视频

            document.querySelectorAll('.video-container').forEach(function (container) {
                var video = container.querySelector('video');
                var overlay = container.querySelector('.video-overlay');

                // 点击覆盖层：暂停其他视频，再切换当前视频的播放状态
                overlay.addEventListener('click', function () {
                    if (currentPlaying && currentPlaying !== video) {
                        currentPlaying.pause();
                    }
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });

                video.addEventListener('play', function () {
                    currentPlaying = video;
                    overlay.style.display = 'none';
                });

                // 暂停或播放结束后恢复覆盖层（原版缺少 pause 处理，手动暂停后覆盖层不会回来）
                video.addEventListener('pause', function () {
                    overlay.style.display = 'flex';
                });

                video.addEventListener('ended', function () {
                    overlay.style.display = 'flex';
                });
            });
        })();
    </script>
</body>

</html>
